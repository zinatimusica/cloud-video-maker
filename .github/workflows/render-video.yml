name: Render MP4 Video

on:
  workflow_dispatch:
    inputs:
      configJson:
        description: 'Paste JSON from Web App (or leave blank for default RIVL demo)'
        type: string
        required: false
        default: ''

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          npm install
          pip install --quiet "edge-tts>=7.3.0" mutagen gTTS
          npx remotion browser ensure

      - name: Generate Multi-Voice Audio & Scene Timings
        env:
          WORKFLOW_INPUT: ${{ toJson(github.event.inputs) }}
        run: |
          node -e "require('fs').writeFileSync('input-props.json', process.env.WORKFLOW_INPUT || '{}')"
          python3 scripts/tts.py

      - name: Render 1080p MP4 Video
        run: |
          mkdir -p out
          npx remotion render src/index.ts ModularVideo out/video.mp4 --props=./input-props.json --codec=h264

      - name: Upload MP4 (Direct File)
        uses: actions/upload-artifact@v7
        with:
          path: out/video.mp4
          archive: false
          retention-days: 7
