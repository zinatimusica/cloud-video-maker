name: Render MP4 Video

on:
  workflow_dispatch:
    inputs:
      template:
        description: 'Choose Video Style'
        type: choice
        required: true
        default: 'GuysMathSkit'
        options:
          - GuysMathSkit
          - StoryCaptions
          - KineticPromo
          - ChartExplainer
          - FlowOverlay
      configJson:
        description: 'Web App Config JSON (leave blank if running manually)'
        type: string
        required: false
        default: ''
      topBadge:
        description: 'Top Banner Text'
        type: string
        required: false
        default: 'GUYS MATH:'
      line1:
        description: 'Line 1'
        type: string
        required: false
        default: 'Twenty bucks for a shirt? Nah, too expensive.'
      line2:
        description: 'Line 2'
        type: string
        required: false
        default: 'Four hundred thousand for this car? Easy.'
      line3:
        description: 'Line 3'
        type: string
        required: false
        default: 'Sold the house. Worth it.'
      stampWord:
        description: 'Big Stamp Word'
        type: string
        required: false
        default: 'SOLD'
      accentColor:
        description: 'Banner Color (Hex)'
        type: string
        required: false
        default: '#facc15'
      voice:
        description: 'AI Voiceover'
        type: choice
        required: false
        default: 'en-US-GuyNeural'
        options:
          - en-US-GuyNeural
          - en-US-AndrewMultilingualNeural
          - en-US-AvaNeural
          - en-GB-RyanNeural
          - none

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          npm install
          pip install --quiet "edge-tts>=7.3.0" mutagen gTTS
          npx remotion browser ensure

      - name: Write inputs & generate voiceover + captions
        env:
          WORKFLOW_INPUT: ${{ toJson(github.event.inputs) }}
        run: |
          node -e "require('fs').writeFileSync('input-props.json', process.env.WORKFLOW_INPUT || '{}')"
          python3 scripts/tts.py

      - name: Render MP4 Video
        run: |
          mkdir -p out
          npx remotion render src/index.ts "${{ github.event.inputs.template }}" out/video.mp4 --props=./input-props.json --codec=h264

      - name: Upload MP4 (Unzipped)
        uses: actions/upload-artifact@v7
        with:
          path: out/video.mp4
          archive: false
          retention-days: 7
